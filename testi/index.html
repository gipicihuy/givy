<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Givy Testi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root {
  --bg: #F3F2EE;
  --surface: #FFFFFF;
  --surface-soft: #FAF9F6;
  --text: #16181B;
  --text-muted: #6E7178;
  --border: #E7E4DD;
  --accent: #2F6F52;
  --accent-dark: #234F3B;
  --accent-soft: #E4EEE7;
  --shadow-sm: 0 1px 2px rgba(20, 20, 20, 0.04);
  --shadow-md: 0 12px 28px rgba(20, 20, 20, 0.08);
  --shadow-lg: 0 24px 48px rgba(20, 20, 20, 0.14);
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 24px;
}

.topbar {
  padding: 28px 0;
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.01em;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.topbar-note {
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}

.topbar-note svg {
  width: 15px;
  height: 15px;
  color: var(--accent);
}

.hero {
  padding: 64px 0 40px;
  text-align: center;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  opacity: 0;
  transform: translateY(10px);
  animation: rise 0.7s ease forwards;
}

.hero-eyebrow svg {
  width: 15px;
  height: 15px;
}

.hero h1 {
  margin-top: 22px;
  font-size: clamp(40px, 7vw, 68px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.04;
  opacity: 0;
  transform: translateY(14px);
  animation: rise 0.8s ease 0.08s forwards;
}

.hero p {
  margin: 18px auto 0;
  max-width: 520px;
  font-size: 16px;
  color: var(--text-muted);
  opacity: 0;
  transform: translateY(14px);
  animation: rise 0.8s ease 0.16s forwards;
}

.stats {
  margin-top: 40px;
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  opacity: 0;
  transform: translateY(14px);
  animation: rise 0.8s ease 0.24s forwards;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 26px;
  min-width: 140px;
  box-shadow: var(--shadow-sm);
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.stat-value.accent {
  color: var(--accent);
}

.stat-label {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--text-muted);
}

@keyframes rise {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.section {
  padding: 56px 0 100px;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.section-head h2 {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.section-head span {
  font-size: 14px;
  color: var(--text-muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  max-width: 680px;
  margin: 0 auto;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
  opacity: 0;
  transform: translateY(18px);
  animation: rise 0.6s ease forwards;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
  border-color: transparent;
}

.card-photo {
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--surface-soft);
}

.card-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
  transition: transform 0.4s ease;
}

.card-photo:hover img {
  transform: scale(1.05);
}

.card-photo-hint {
  position: absolute;
  inset: 0;
  background: rgba(22, 24, 27, 0.32);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
  color: #fff;
}

.card-photo:hover .card-photo-hint {
  opacity: 1;
}

.card-photo-hint svg {
  width: 22px;
  height: 22px;
}

.card-body {
  padding: 18px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.card-id {
  flex: 1;
  min-width: 0;
}

.card-name {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.card-product {
  margin-top: 4px;
  font-size: 13.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.card-product svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}

.card-price {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--accent-dark);
  font-weight: 700;
}

.card-price svg {
  width: 12px;
  height: 12px;
}

.card-rating {
  display: flex;
  gap: 2px;
}

.card-rating svg {
  width: 16px;
  height: 16px;
  color: #D8D5CC;
}

.card-rating svg.filled {
  color: #E3A73F;
  fill: #E3A73F;
}

.card-message {
  position: relative;
  font-size: 14px;
  color: var(--text);
  line-height: 1.55;
  padding-left: 16px;
  border-left: 2px solid var(--accent-soft);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  font-size: 12px;
  color: var(--text-muted);
}

.card-footer-date {
  display: flex;
  align-items: center;
  gap: 5px;
}

.card-footer-date svg {
  width: 13px;
  height: 13px;
}


.empty-state, .error-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.footer {
  padding: 20px 0 28px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(15, 16, 18, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 100;
}

.lightbox.open {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-inner {
  position: relative;
  max-width: 480px;
  width: 100%;
  transform: scale(0.94);
  transition: transform 0.3s ease;
}

.lightbox.open .lightbox-inner {
  transform: scale(1);
}

.lightbox-frame {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  line-height: 0;
}

.lightbox-frame img {
  width: 100%;
  display: block;
}

.lightbox-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  background: rgba(15, 16, 18, 0.55);
  backdrop-filter: blur(4px);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #fff;
}

.lightbox-close svg {
  width: 17px;
  height: 17px;
}

@media (max-width: 620px) {
  .hero {
    padding: 48px 0 32px;
  }

  .stats {
    gap: 10px;
  }

  .stat-card {
    padding: 14px 20px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .section {
    padding: 40px 0 70px;
  }
}

@media (max-width: 420px) {
  .grid {
    gap: 10px;
  }

  .card-body {
    padding: 14px 14px 16px;
    gap: 8px;
  }

  .card-name {
    font-size: 14px;
  }

  .card-product {
    font-size: 12px;
  }

  .card-message {
    font-size: 12.5px;
  }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-mark"><img src="https://athars.space/uploads/1ffc29b1.png" alt="Givy Testi"></span>
      Givy Testi
    </div>
    <div class="topbar-note">
      <svg data-lucide="shield-check"></svg>
      Bukti transaksi asli
    </div>
  </div>
</div>

<section class="hero">
  <div class="wrap">
    <span class="hero-eyebrow">
      <svg data-lucide="badge-check"></svg>
      Testimoni pembeli
    </span>
    <h1>Givy Testi</h1>
    <p>Kumpulan bukti transaksi dan ulasan jujur dari pembeli yang sudah dilayani langsung.</p>
    <div class="stats" id="stats"></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <h2>Semua testimoni</h2>
      <span id="countLabel"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<div class="footer">
  Givy Testi
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="lightbox-frame">
      <img id="lightboxImg" src="" alt="Bukti transaksi">
      <button class="lightbox-close" id="lightboxClose">
        <svg data-lucide="x"></svg>
      </button>
    </div>
  </div>
</div>

<script>
const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');
const countLabel = document.getElementById('countLabel');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');

function formatDate(value) {
  const date = new Date(value);
  if (isNaN(date.getTime())) return value;
  return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function buildRating(rating) {
  let html = '<div class="card-rating">';
  for (let i = 1; i <= 5; i++) {
    const filled = i <= rating ? 'filled' : '';
    html += '<svg data-lucide="star" class="' + filled + '"></svg>';
  }
  html += '</div>';
  return html;
}

function buildCard(item, index) {
  const card = document.createElement('article');
  card.className = 'card';
  card.style.animationDelay = (index * 0.06) + 's';
  card.innerHTML =
    '<div class="card-photo" data-img="' + item.img + '">' +
      '<img src="' + item.img + '" alt="Bukti transaksi ' + item.name + '" loading="lazy">' +
      '<div class="card-photo-hint"><svg data-lucide="zoom-in"></svg></div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-id">' +
        '<div class="card-name">' + item.name + '</div>' +
        '<div class="card-product"><svg data-lucide="package"></svg>' + item.product + '<span class="card-price"><svg data-lucide="tag"></svg>' + item.price + '</span></div>' +
      '</div>' +
      buildRating(item.rating) +
      '<p class="card-message">' + item.message + '</p>' +
      '<div class="card-footer">' +
        '<div class="card-footer-date"><svg data-lucide="calendar"></svg>' + formatDate(item.date) + '</div>' +
      '</div>' +
    '</div>';
  return card;
}

function buildStats(data) {
  const total = data.length;
  const avg = total ? (data.reduce((sum, item) => sum + Number(item.rating || 0), 0) / total) : 0;
  const products = new Set(data.map(item => item.product)).size;
  const stats = [
    { value: total, label: 'Total testimoni', accent: false },
    { value: avg.toFixed(1), label: 'Rata-rata rating', accent: true },
    { value: products, label: 'Produk terjual', accent: false }
  ];
  statsEl.innerHTML = stats.map(stat =>
    '<div class="stat-card">' +
      '<div class="stat-value' + (stat.accent ? ' accent' : '') + '">' + stat.value + '</div>' +
      '<div class="stat-label">' + stat.label + '</div>' +
    '</div>'
  ).join('');
}

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

function render(data) {
  if (!data.length) {
    grid.innerHTML = '<div class="empty-state">Belum ada testimoni untuk ditampilkan.</div>';
    countLabel.textContent = '';
    return;
  }
  buildStats(data);
  countLabel.textContent = data.length + ' testimoni ditampilkan';
  grid.innerHTML = '';
  data.forEach((item, index) => {
    grid.appendChild(buildCard(item, index));
  });
  grid.querySelectorAll('.card-photo').forEach(photo => {
    photo.addEventListener('click', () => openLightbox(photo.getAttribute('data-img')));
  });
  lucide.createIcons();
}

fetch('/testi/testi.json')
  .then(response => {
    if (!response.ok) throw new Error('Gagal memuat data');
    return response.json();
  })
  .then(data => render(data))
  .catch(() => {
    grid.innerHTML = '<div class="error-state">Data testimoni tidak dapat dimuat.</div>';
  });

lucide.createIcons();
</script>
</body>
</html>
