<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Givy Testi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root {
  --bg: #F3F2EE;
  --surface: #FFFFFF;
  --surface-soft: #FAF9F6;
  --text: #16181B;
  --text-muted: #6E7178;
  --border: #E7E4DD;
  --accent: #2F6F52;
  --accent-dark: #234F3B;
  --accent-soft: #E4EEE7;
  --shadow-sm: 0 1px 2px rgba(20, 20, 20, 0.04);
  --shadow-md: 0 12px 28px rgba(20, 20, 20, 0.08);
  --shadow-lg: 0 24px 48px rgba(20, 20, 20, 0.14);
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181B;
    --surface: #1E2023;
    --surface-soft: #24272B;
    --text: #F2F1ED;
    --text-muted: #9A9DA5;
    --border: #2D3034;
    --accent: #4CA37B;
    --accent-dark: #7FD9AE;
    --accent-soft: rgba(76, 163, 123, 0.16);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.55);
  }
}

html[data-theme="dark"] {
  --bg: #16181B;
  --surface: #1E2023;
  --surface-soft: #24272B;
  --text: #F2F1ED;
  --text-muted: #9A9DA5;
  --border: #2D3034;
  --accent: #4CA37B;
  --accent-dark: #7FD9AE;
  --accent-soft: rgba(76, 163, 123, 0.16);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 24px 48px rgba(0, 0, 0, 0.55);
}

html[data-theme="light"] {
  --bg: #F3F2EE;
  --surface: #FFFFFF;
  --surface-soft: #FAF9F6;
  --text: #16181B;
  --text-muted: #6E7178;
  --border: #E7E4DD;
  --accent: #2F6F52;
  --accent-dark: #234F3B;
  --accent-soft: #E4EEE7;
  --shadow-sm: 0 1px 2px rgba(20, 20, 20, 0.04);
  --shadow-md: 0 12px 28px rgba(20, 20, 20, 0.08);
  --shadow-lg: 0 24px 48px rgba(20, 20, 20, 0.14);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

*, *::before, *::after {
  transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
}

html {
  scroll-behavior: smooth;
}

a, button {
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 24px;
}

.topbar {
  padding: 28px 0;
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-mark {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.brand-mark img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.theme-toggle {
  width: 40px;
  height: 40px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.theme-toggle:hover {
  background: var(--surface-soft);
}

.theme-toggle:active {
  transform: scale(0.92);
}

.theme-icon {
  width: 18px;
  height: 18px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(0deg);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.icon-sun {
  opacity: 1;
}

.icon-moon {
  opacity: 0;
  transform: translate(-50%, -50%) rotate(-90deg);
}

html[data-theme="dark"] .icon-sun {
  opacity: 0;
  transform: translate(-50%, -50%) rotate(90deg);
}

html[data-theme="dark"] .icon-moon {
  opacity: 1;
  transform: translate(-50%, -50%) rotate(0deg);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 19px;
  letter-spacing: -0.01em;
}

.hero {
  padding: 64px 0 40px;
  text-align: center;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  opacity: 0;
  transform: translateY(10px);
  animation: rise 0.7s ease forwards;
}

.hero-eyebrow svg {
  width: 15px;
  height: 15px;
}

.hero h1 {
  margin-top: 22px;
  font-size: clamp(40px, 7vw, 68px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.04;
  opacity: 0;
  transform: translateY(14px);
  animation: rise 0.8s ease 0.08s forwards;
}

.hero p {
  margin: 18px auto 0;
  max-width: 520px;
  font-size: 16px;
  color: var(--text-muted);
  opacity: 0;
  transform: translateY(14px);
  animation: rise 0.8s ease 0.16s forwards;
}

.stats {
  margin-top: 40px;
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  opacity: 0;
  transform: translateY(14px);
  animation: rise 0.8s ease 0.24s forwards;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 26px;
  min-width: 140px;
  box-shadow: var(--shadow-sm);
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.stat-value.accent {
  color: var(--accent);
}

.stat-label {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--text-muted);
}

@keyframes rise {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.section {
  padding: 56px 0 100px;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.section-head h2 {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.section-head span {
  font-size: 14px;
  color: var(--text-muted);
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  max-width: 680px;
  margin: 0 auto;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
  opacity: 0;
  transform: translateY(18px);
  animation: rise 0.6s ease forwards;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg);
  border-color: transparent;
}

.card-photo {
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  background: var(--surface-soft);
}

.card-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
  transition: transform 0.4s ease;
}

.card-photo:hover img {
  transform: scale(1.05);
}

.card-photo:active img {
  transform: scale(0.97);
}

.card-photo-hint {
  position: absolute;
  inset: 0;
  background: rgba(22, 24, 27, 0.32);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
  color: #fff;
}

.card-photo:hover .card-photo-hint {
  opacity: 1;
}

.card-photo-hint svg {
  width: 22px;
  height: 22px;
}

.card-body {
  padding: 18px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.card-id {
  flex: 1;
  min-width: 0;
}

.card-name {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.card-product {
  margin-top: 4px;
  font-size: 13.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.card-product svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}

.card-price {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--accent-dark);
  font-weight: 700;
}

.card-price svg {
  width: 12px;
  height: 12px;
}

.card-message {
  position: relative;
  font-size: 14px;
  color: var(--text);
  line-height: 1.55;
  padding-left: 16px;
  border-left: 2px solid var(--accent-soft);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  font-size: 12px;
  color: var(--text-muted);
}

.card-footer-date {
  display: flex;
  align-items: center;
  gap: 5px;
}

.card-footer-date svg {
  width: 13px;
  height: 13px;
}


.empty-state, .error-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.footer {
  padding: 20px 0 28px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(15, 16, 18, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 100;
}

.lightbox.open {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-inner {
  position: relative;
  max-width: 480px;
  width: 100%;
  transform: scale(0.94);
  transition: transform 0.3s ease;
}

.lightbox.open .lightbox-inner {
  transform: scale(1);
}

.lightbox-frame {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  line-height: 0;
}

.lightbox-frame img {
  width: 100%;
  display: block;
}

.lightbox-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  background: rgba(15, 16, 18, 0.55);
  backdrop-filter: blur(4px);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #fff;
  transition: transform 0.2s ease, background 0.2s ease;
}

.lightbox-close:active {
  transform: scale(0.9);
  background: rgba(15, 16, 18, 0.75);
}

.lightbox-close svg {
  width: 17px;
  height: 17px;
}

@media (max-width: 620px) {
  .hero {
    padding: 48px 0 32px;
  }

  .stats {
    gap: 10px;
  }

  .stat-card {
    padding: 14px 20px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .section {
    padding: 40px 0 70px;
  }
}

@media (max-width: 420px) {
  .grid {
    gap: 10px;
  }

  .card-body {
    padding: 14px 14px 16px;
    gap: 8px;
  }

  .card-name {
    font-size: 14px;
  }

  .card-product {
    font-size: 12px;
  }

  .card-message {
    font-size: 12.5px;
  }
}

.mp {
  position: fixed;
  top: 50%;
  top: 50svh;
  right: 20px;
  transform: translateY(-50%) translateZ(0);
  will-change: transform;
  z-index: 200;
  display: flex;
  align-items: center;
}

.mp-toggle {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 999px;
  background: var(--accent);
  border: none;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--shadow-md);
  transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  position: relative;
  flex-shrink: 0;
}

.mp-toggle:hover {
  transform: scale(1.06);
  box-shadow: var(--shadow-lg);
}

.mp-toggle:active {
  transform: scale(0.94);
}

.mp-toggle svg {
  width: 18px;
  height: 18px;
}

.mp-toggle .mp-icon-close {
  position: absolute;
  opacity: 0;
  transform: scale(0.6) rotate(-45deg);
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.mp-toggle .mp-icon-open {
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.mp.open .mp-toggle .mp-icon-close {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.mp.open .mp-toggle .mp-icon-open {
  opacity: 0;
  transform: scale(0.6) rotate(45deg);
}

.mp-toggle.spin svg.mp-icon-open {
  animation: mp-spin 3.2s linear infinite;
}

@keyframes mp-spin {
  to { transform: rotate(360deg); }
}

.mp-panel {
  width: 340px;
  max-width: calc(100vw - 76px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: var(--shadow-lg);
  padding: 8px 16px 8px 8px;
  margin-right: 12px;
  opacity: 0;
  transform: translateX(24px) scale(0.96);
  pointer-events: none;
  transition: opacity 0.32s cubic-bezier(.2,.8,.2,1), transform 0.32s cubic-bezier(.2,.8,.2,1);
  order: -1;
  display: flex;
  align-items: center;
  gap: 12px;
}

.mp.open .mp-panel {
  opacity: 1;
  transform: translateX(0) scale(1);
  pointer-events: auto;
}

.mp-cover-wrap {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface-soft);
  box-shadow: var(--shadow-sm);
}

.mp-cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.mp-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mp-meta {
  text-align: left;
  line-height: 1.25;
}

.mp-title {
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mp-artist {
  margin-top: 1px;
  font-size: 11.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mp-progress-row {
  margin-top: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.mp-time {
  font-size: 9.5px;
  color: var(--text-muted);
  min-width: 22px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.mp-progress {
  flex: 1;
  height: 4px;
  border-radius: 999px;
  background: var(--border);
  position: relative;
  cursor: pointer;
}

.mp-progress-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: var(--accent);
}

.mp-progress-handle {
  position: absolute;
  top: 50%;
  width: 11px;
  height: 11px;
  border-radius: 999px;
  background: var(--accent);
  transform: translate(-50%, -50%);
  left: 0%;
  box-shadow: var(--shadow-sm);
}

.mp-controls {
  margin-top: 0;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.mp-btn {
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, color 0.2s ease;
  padding: 4px;
  flex-shrink: 0;
}

.mp-btn:hover {
  color: var(--accent);
}

.mp-btn:active {
  transform: scale(0.9);
}

.mp-btn svg {
  width: 15px;
  height: 15px;
}

.mp-btn-play {
  width: 36px;
  height: 36px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  position: relative;
}

.mp-btn-play:hover {
  color: #fff;
  background: var(--accent-dark);
}

.mp-btn-play svg {
  width: 15px;
  height: 15px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.mp-btn-play .mp-icon-pause {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.7);
}

.mp-btn-play.is-playing .mp-icon-play {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.7);
}

.mp-btn-play.is-playing .mp-icon-pause {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.mp-empty {
  text-align: center;
  padding: 6px 10px;
  font-size: 11.5px;
  color: var(--text-muted);
}

@media (max-width: 620px) {
  .mp {
    right: 14px;
  }

  .mp-panel {
    width: 280px;
    max-width: calc(100vw - 66px);
    padding: 7px 14px 7px 7px;
    gap: 10px;
  }

  .mp-toggle {
    width: 38px;
    height: 38px;
    min-width: 38px;
  }

  .mp-toggle svg {
    width: 16px;
    height: 16px;
  }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-mark"><img src="https://athars.space/uploads/1ffc29b1.png" alt="Givy Testi"></span>
      Givy Testi
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">
      <svg data-lucide="sun" class="theme-icon icon-sun"></svg>
      <svg data-lucide="moon" class="theme-icon icon-moon"></svg>
    </button>
  </div>
</div>

<section class="hero">
  <div class="wrap">
    <span class="hero-eyebrow">
      <svg data-lucide="badge-check"></svg>
      Testimoni pembeli
    </span>
    <h1>Givy Testi</h1>
    <p>Kumpulan bukti transaksi dan ulasan jujur dari pembeli yang sudah dilayani langsung.</p>
    <div class="stats" id="stats"></div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <h2>Semua testimoni</h2>
      <span id="countLabel"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<div class="footer">
  Givy Testi
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="lightbox-frame">
      <img id="lightboxImg" src="" alt="Bukti transaksi">
      <button class="lightbox-close" id="lightboxClose">
        <svg data-lucide="x"></svg>
      </button>
    </div>
  </div>
</div>

<div class="mp" id="mp">
  <div class="mp-panel" id="mpPanel">
    <div class="mp-cover-wrap">
      <img id="mpCover" src="" alt="Cover album">
    </div>
    <div class="mp-body">
      <div class="mp-meta">
        <div class="mp-title" id="mpTitle">-</div>
        <div class="mp-artist" id="mpArtist">-</div>
      </div>
      <div class="mp-progress-row">
        <span class="mp-time" id="mpCurrentTime">0:00</span>
        <div class="mp-progress" id="mpProgress">
          <div class="mp-progress-fill" id="mpProgressFill"></div>
          <div class="mp-progress-handle" id="mpProgressHandle"></div>
        </div>
        <span class="mp-time" id="mpDuration">0:00</span>
      </div>
    </div>
    <div class="mp-controls">
      <button class="mp-btn" id="mpPrev" aria-label="Lagu sebelumnya">
        <svg data-lucide="skip-back"></svg>
      </button>
      <button class="mp-btn mp-btn-play" id="mpPlay" aria-label="Play/Pause">
        <svg data-lucide="play" class="mp-icon-play"></svg>
        <svg data-lucide="pause" class="mp-icon-pause"></svg>
      </button>
      <button class="mp-btn" id="mpNext" aria-label="Lagu berikutnya">
        <svg data-lucide="skip-forward"></svg>
      </button>
    </div>
  </div>
  <button class="mp-toggle" id="mpToggle" aria-label="Buka pemutar musik">
    <svg data-lucide="music" class="mp-icon-open"></svg>
    <svg data-lucide="x" class="mp-icon-close"></svg>
  </button>
</div>

<script>
const grid = document.getElementById('grid');
const statsEl = document.getElementById('stats');
const countLabel = document.getElementById('countLabel');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxClose = document.getElementById('lightboxClose');
const themeToggle = document.getElementById('themeToggle');

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}

function getStoredTheme() {
  try {
    return localStorage.getItem('theme');
  } catch (e) {
    return null;
  }
}

function storeTheme(theme) {
  try {
    localStorage.setItem('theme', theme);
  } catch (e) {}
}

const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
let currentTheme = getStoredTheme() || systemTheme;
applyTheme(currentTheme);

themeToggle.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(currentTheme);
  storeTheme(currentTheme);
});

function formatDate(value) {
  const date = new Date(value);
  if (isNaN(date.getTime())) return value;
  return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

function buildCard(item, index) {
  const card = document.createElement('article');
  card.className = 'card';
  card.style.animationDelay = (index * 0.06) + 's';
  card.innerHTML =
    '<div class="card-photo" data-img="' + item.img + '">' +
      '<img src="' + item.img + '" alt="Bukti transaksi ' + item.name + '" loading="lazy">' +
      '<div class="card-photo-hint"><svg data-lucide="zoom-in"></svg></div>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-id">' +
        '<div class="card-name">' + item.name + '</div>' +
        '<div class="card-product"><svg data-lucide="package"></svg>' + item.product + '<span class="card-price"><svg data-lucide="tag"></svg>' + item.price + '</span></div>' +
      '</div>' +
      '<p class="card-message">' + item.message + '</p>' +
      '<div class="card-footer">' +
        '<div class="card-footer-date"><svg data-lucide="calendar"></svg>' + formatDate(item.date) + '</div>' +
      '</div>' +
    '</div>';
  return card;
}

function buildStats(data) {
  const total = data.length;
  const stats = [
    { value: total, label: 'Total testimoni', accent: true }
  ];
  statsEl.innerHTML = stats.map(stat =>
    '<div class="stat-card">' +
      '<div class="stat-value' + (stat.accent ? ' accent' : '') + '">' + stat.value + '</div>' +
      '<div class="stat-label">' + stat.label + '</div>' +
    '</div>'
  ).join('');
}

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

function render(data) {
  if (!data.length) {
    grid.innerHTML = '<div class="empty-state">Belum ada testimoni untuk ditampilkan.</div>';
    countLabel.textContent = '';
    return;
  }
  buildStats(data);
  countLabel.textContent = data.length + ' testimoni ditampilkan';
  grid.innerHTML = '';
  data.forEach((item, index) => {
    grid.appendChild(buildCard(item, index));
  });
  grid.querySelectorAll('.card-photo').forEach(photo => {
    photo.addEventListener('click', () => openLightbox(photo.getAttribute('data-img')));
  });
  lucide.createIcons();
}

fetch('/testi/testi.json')
  .then(response => {
    if (!response.ok) throw new Error('Gagal memuat data');
    return response.json();
  })
  .then(data => render(data))
  .catch(() => {
    grid.innerHTML = '<div class="error-state">Data testimoni tidak dapat dimuat.</div>';
  });

const mp = document.getElementById('mp');
const mpToggle = document.getElementById('mpToggle');
const mpPanel = document.getElementById('mpPanel');
const mpCover = document.getElementById('mpCover');
const mpTitle = document.getElementById('mpTitle');
const mpArtist = document.getElementById('mpArtist');
const mpPlay = document.getElementById('mpPlay');
const mpPrev = document.getElementById('mpPrev');
const mpNext = document.getElementById('mpNext');
const mpProgress = document.getElementById('mpProgress');
const mpProgressFill = document.getElementById('mpProgressFill');
const mpProgressHandle = document.getElementById('mpProgressHandle');
const mpCurrentTime = document.getElementById('mpCurrentTime');
const mpDuration = document.getElementById('mpDuration');

const audio = new Audio();
audio.volume = 0.8;
let playlist = [];
let currentIndex = 0;
let isSeeking = false;

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function loadTrack(index, autoplay) {
  if (!playlist.length) return;
  currentIndex = (index + playlist.length) % playlist.length;
  const track = playlist[currentIndex];
  audio.src = track.audio;
  mpCover.src = track.cover;
  mpTitle.textContent = track.title;
  mpArtist.textContent = track.artist;
  mpProgressFill.style.width = '0%';
  mpProgressHandle.style.left = '0%';
  mpCurrentTime.textContent = '0:00';
  mpDuration.textContent = '0:00';
  if (autoplay) {
    audio.play().catch(() => {});
  }
}

function setPlayingState(playing) {
  mpPlay.classList.toggle('is-playing', playing);
  mpToggle.classList.toggle('spin', playing);
}

mpPlay.addEventListener('click', () => {
  if (!playlist.length) return;
  if (audio.paused) {
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
});

mpPrev.addEventListener('click', () => {
  loadTrack(currentIndex - 1, true);
});

mpNext.addEventListener('click', () => {
  loadTrack(currentIndex + 1, true);
});

audio.addEventListener('play', () => setPlayingState(true));
audio.addEventListener('pause', () => setPlayingState(false));

audio.addEventListener('timeupdate', () => {
  if (isSeeking || !audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  mpProgressFill.style.width = pct + '%';
  mpProgressHandle.style.left = pct + '%';
  mpCurrentTime.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  mpDuration.textContent = formatTime(audio.duration);
});

audio.addEventListener('ended', () => {
  loadTrack(currentIndex + 1, true);
});

function seekFromEvent(e) {
  const rect = mpProgress.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let pct = (clientX - rect.left) / rect.width;
  pct = Math.min(1, Math.max(0, pct));
  mpProgressFill.style.width = (pct * 100) + '%';
  mpProgressHandle.style.left = (pct * 100) + '%';
  if (audio.duration) {
    audio.currentTime = pct * audio.duration;
    mpCurrentTime.textContent = formatTime(audio.currentTime);
  }
}

mpProgress.addEventListener('mousedown', (e) => {
  isSeeking = true;
  seekFromEvent(e);
  const onMove = (ev) => seekFromEvent(ev);
  const onUp = () => {
    isSeeking = false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

mpProgress.addEventListener('touchstart', (e) => {
  isSeeking = true;
  seekFromEvent(e);
});

mpProgress.addEventListener('touchmove', (e) => {
  seekFromEvent(e);
});

mpProgress.addEventListener('touchend', () => {
  isSeeking = false;
});

mpToggle.addEventListener('click', () => {
  mp.classList.toggle('open');
});

document.addEventListener('click', (e) => {
  if (mp.classList.contains('open') && !mp.contains(e.target)) {
    mp.classList.remove('open');
  }
});

fetch('/testi/music/playlist.json')
  .then(response => {
    if (!response.ok) throw new Error('Gagal memuat playlist');
    return response.json();
  })
  .then(data => {
    playlist = data;
    if (playlist.length) {
      loadTrack(0, false);
    } else {
      mpPanel.innerHTML = '<div class="mp-empty">Belum ada lagu di playlist.</div>';
    }
  })
  .catch(() => {
    mpPanel.innerHTML = '<div class="mp-empty">Playlist tidak dapat dimuat.</div>';
  });

lucide.createIcons();
</script>
</body>
</html>
